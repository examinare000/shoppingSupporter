name: API型同期チェック

on:
  pull_request:
    paths:
      - 'api/**'
      - 'frontend/types/api.ts'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/check-api-types.yml'
      - 'scripts/export_openapi.py'
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'frontend/types/api.ts'

jobs:
  check-api-types:
    name: OpenAPI → TypeScript 型ドリフト検知
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Python 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: OpenAPI スキーマをファイルに書き出し
        run: python scripts/export_openapi.py > /tmp/openapi.json
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/shoppingsupporter
          JWT_SECRET: ci-only-secret

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm 依存パッケージのインストール
        run: npm ci
        working-directory: frontend

      - name: OpenAPI スキーマから TypeScript 型を再生成
        run: npx openapi-typescript /tmp/openapi.json -o ./types/api.ts
        working-directory: frontend

      - name: 型ドリフト検知（差分があれば失敗）
        run: |
          if ! git diff --exit-code frontend/types/api.ts; then
            echo ""
            echo "::error::frontend/types/api.ts がバックエンドの OpenAPI スキーマと一致しません。"
            echo "::error::ローカルで 'npm run gen:api' を実行してコミットしてください。"
            exit 1
          fi

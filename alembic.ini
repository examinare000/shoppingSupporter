[alembic]
# Path is relative to the directory the alembic command is invoked from.
# Migrations are run from the repository root (CI or developer machine
# pointing at Neon), so `script_location = alembic` resolves to ./alembic/.
script_location = alembic

# `sqlalchemy.url` is left empty on purpose: the value is supplied at runtime
# by env.py (production) or by the test fixture (tests). Hard-coding here
# would create two conflicting sources of truth.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
